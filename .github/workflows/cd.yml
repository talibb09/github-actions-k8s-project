name: CD Workflow

on:
    workflow_run:
        workflows: ["CI Workflow"]
        types: [completed]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4  

          - name: Execute remote SSH commands using password
            uses: appleboy/ssh-action@v1
            with:
               host: ${{ secrets.HOST }}
               username: ${{ secrets.EC2_USER }}
               key: ${{ secrets.EC2_SSH_KEY }}
               port: 22
               script: |
                set -e
                git clone https://github.com/talibb09/github-actions-k8s-project.git
                cd ~/github-actions-k8s-project
                git pull origin main
                docker compose pull
                docker compose up -d